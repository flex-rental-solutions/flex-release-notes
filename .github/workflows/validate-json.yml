name: Validate JSON Files

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install -r requirements-validation.txt

      - name: Test content validation
        run: python -m unittest discover -s tests -v

      - name: Validate schema and proposed content
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=HEAD
          fi
          python scripts/check_release_notes.py --base "$BASE_REF"

      - name: Validate flex-enterprise.json
        run: |
          if ! jq -e '. | length > 0' flex-enterprise.json > /dev/null; then
            echo "Error: flex-enterprise.json is empty or invalid JSON"
            exit 1
          fi

      - name: Validate flex-assets.json
        run: |
          if ! jq -e '. | length > 0' flex-assets.json > /dev/null; then
            echo "Error: flex-assets.json is empty or invalid JSON"
            exit 1
          fi
